[build]
builder = "RAILPACK"
# ZIP is packed locally before `railway up`; keep install light on the builder.
buildCommand = "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --omit=dev"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/demo/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
HOST = "0.0.0.0"
DEMO_MODE = "true"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
