[build]
builder = "NIXPACKS"
# Playwright Chromium required for /api/import-listing and /api/collect-comps
buildCommand = "npm install --omit=dev && npx playwright install --with-deps chromium"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/demo/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
HOST = "0.0.0.0"
DEMO_MODE = "true"
