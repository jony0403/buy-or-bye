<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Buy or Bye">
  <g fill="#FF6F0F" stroke="none">
    <!-- beam -->
    <rect x="10" y="17" width="44" height="3.2" rx="1.6"/>
    <!-- mast -->
    <rect x="30.4" y="12" width="3.2" height="30" rx="1.6"/>
    <!-- pivot -->
    <circle cx="32" cy="17" r="2.2"/>
    <!-- left chain + pan -->
    <path d="M16 20.2v5.8l-5.2 3.2c-1.4.9-1.8 2.8-.9 4.2 1.2 1.8 3.8 1.8 5 0l4.1-6.2V20.2H16Z"/>
    <ellipse cx="14.5" cy="36.5" rx="7.5" ry="2.2"/>
    <!-- right chain + pan (heavier / buy side cue) -->
    <path d="M48 20.2v5.8l5.2 3.2c1.4.9 1.8 2.8.9 4.2-1.2 1.8-3.8 1.8-5 0l-4.1-6.2V20.2H48Z"/>
    <ellipse cx="49.5" cy="38.2" rx="8.2" ry="2.4"/>
    <!-- base -->
    <path d="M24 42h16l-3.2 8.8c-.8 2.2-3.6 2.2-4.4 0L24 42Z"/>
  </g>
</svg>
